<div class="cmp-product-comparison">
    <h2
        class="cmp-product-comparison__title"
        data-section-title-template="${'Comparing {0} Products' @ i18n}"
    ></h2>

    <template>
        <div class="cmp-product-comparison__product">
            <h3 class="cmp-product-comparison__product-title"></h3>
            <img
                class="cmp-product-comparison__product-image"
                src=""
                alt=""
                height="400"
                width="600"
            />
            <button class="cmp-product-comparison__remove-btn">${'remove' @ i18n}</button>
            <sly
                data-sly-use.component="solidigm/components/customselect/customselect.html"
                data-sly-call="${component.customSelect @ 
                                    label='Filter',
                                    id='tagged-articles-filter',
                                    name='filter',
                                    srOnly=true}"
            />
            <div class="cmp-product-comparison__product-section">
                <h3 class="cmp-product-comparison__product-section-title">
                    ${'By The Numbers' @ i18n}
                </h3>
                <dl class="cmp-product-comparison__specs-list">
                    <dt>${'Capacity' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Form Factor' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Interface' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Technology' @ i18n}</dt>
                    <dd></dd>
                </dl>
            </div>
            <div class="cmp-product-comparison__product-section">
                <h3 class="cmp-product-comparison__product-section-title">
                    ${'Performance Specifications' @ i18n}
                </h3>
                <dl class="cmp-product-comparison__specs-list">
                    <dt>${'Sequential bandwidth - 100% read (up to)' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Sequential bandwidth - 100% write (up to)' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Random read (100% span)' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Random write (100% span)' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Latency - Read' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Latency - Write' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Power - Active' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Power - Idle' @ i18n}</dt>
                    <dd></dd>
                </dl>
            </div>
            <div class="cmp-product-comparison__product-section">
                <h3 class="cmp-product-comparison__product-section-title">
                    ${'Reliability' @ i18n}
                </h3>
                <dl class="cmp-product-comparison__specs-list">
                    <dt>${'Warranty Period' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Endurance Rating' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Mean time between failures (MTBF)' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Uncorrectable bit error rate (UBER)' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Vibration - Operating' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Vibration - non Operating' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Shock' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Operating temp range' @ i18n}</dt>
                    <dd></dd>
                </dl>
            </div>
            <div class="cmp-product-comparison__product-section">
                <h3 class="cmp-product-comparison__product-section-title">
                    ${'Advanced Technology' @ i18n}
                </h3>
                <dl class="cmp-product-comparison__specs-list">
                    <dt>${'Hardware encryption' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'Advanced power loss data protection' @ i18n}</dt>
                    <dd></dd>

                    <dt>${'High endurance technology (HET)' @ i18n}</dt>
                    <dd></dd>
                </dl>
            </div>
        </div>
    </template>
    <div class="cmp-product-comparison__grid"></div>
</div>
