<div class="series-list"
     id="series-list"
     data-sly-use.seriesList="com.solidigm.core.models.SeriesList"
     data-sly-list.seriesPage="${seriesList.seriesPages}">
    <a class="series-list__serie" href="${seriesPage.seriesPageLink.link}">
        <img class="series-list__serie__image" src="${seriesPage.image}" alt="${seriesPage.altText}" />
        <div class="series-list__serie__text">
            <h3 class="series-list__serie__text__title">${seriesPage.name}</h3>
            <p class="series-list__serie__text__description">
                ${seriesPage.description}
            </p>
        </div>
    </a>
</div>
