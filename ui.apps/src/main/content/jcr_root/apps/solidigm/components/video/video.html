<sly data-sly-use.video="com.solidigm.core.models.Video"
     data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
     data-sly-test.hasContent="${video.hasContent}">
    <div>
        <p>
            Thumbnail Image: ${video.thumbnailImageReference}
        </p>
        <p>
            thumbnail alt text: ${video.thumbnailAltText}
        </p>
    </div>
    <sly data-sly-resource="${ '.' @ resourceType='solidigm/components/embed', wcmmode='disabled'}"></sly>
</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!hasContent}"></sly>
