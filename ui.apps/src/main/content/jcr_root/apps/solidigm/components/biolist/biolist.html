<sly data-sly-use.biolist="com.solidigm.core.models.BioList"
     data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
     data-sly-test.hasContent="${biolist.hasContent}">
    <ul data-sly-list.bio="${biolist.bioItems}">
        <li>
            <p>
                Image: ${bio.imageReference}
            </p>
            <p>
                Image Alt Text: ${bio.imageAltText}
            </p>
            <p>
                Name: ${bio.name}
            </p>
            <p>
                Title: ${bio.title}
            </p>
            <p>
                Description: ${bio.description}
            </p>
            <p>
                id: ${bio.modalID}
            </p>
        </li>
    </ul>
</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!hasContent}"></sly>
