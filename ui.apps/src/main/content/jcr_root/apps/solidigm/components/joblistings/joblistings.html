<div data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.all @ categories=['solidigm.structure.joblistings']}"
     class="cmp-joblistings" data-path="/hello-world">
    <div class="careerswidget responsivegrid">
        <script
            src="https://code.jquery.com/jquery-3.6.0.min.js"
            integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
            crossorigin="anonymous"
        ></script>
        <link
            rel="stylesheet"
            type="text/css"
            href="https://cdn.datatables.net/1.12.1/css/jquery.dataTables.css"
        />
        <script
            type="text/javascript"
            charset="utf8"
            src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.js"
        ></script>

        <div class="smartWidget" id="smartWidget0"></div>
        <script>
            window.onload = function () {
                // self executing function here
                (function () {
                    const urlSearchParams = new URLSearchParams(
                        window.location.search.replace(/.html/g, '')
                    ); // this is to avoid AEM error where it auto adds .html to the end of the url query params/values
                    const params = Object.fromEntries(urlSearchParams.entries());
                    if (params.filter) {
                        let myElements = document.getElementsByClassName(
                            'srSearchOptionListElement'
                        );
                        for (let i = 0; i < myElements.length; i++) {
                            let childToCheck = myElements[i];
                            if (childToCheck.children[0].dataset.filterValue == params.filter) {
                                // this is to trigger the event for the department choice IF there is a query string filter passed in url.
                                // Not ideal implementation but I haven't found where the widget event is triggered and how to intercept that.
                                childToCheck.click();
                            }
                        }
                    }
                })();
            };
        </script>
    </div>
</div>
