<div data-sly-use.articleinfo="com.solidigm.core.models.ArticleInfo">
    <p>
        Author: ${articleinfo.author}
    </p>
    <p>
        Date: ${articleinfo.date}
    </p>
    <p>
        formatted Date: ${articleinfo.formattedDate}
    </p>
    <ul data-sly-list.tag="${articleinfo.tags}">
        <li>
            Tag label: ${tag.label}
            Tag link: ${tag.link}
        </li>
    </ul>
</div>
