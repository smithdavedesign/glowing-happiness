<sly
    data-sly-use.video="com.solidigm.core.models.Video"
    data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
    data-sly-test.hasContent="${video.hasContent}"
>
    <div class="cmp-video">
        <img
            src="${video.thumbnailImageReference}"
            alt="${video.thumbnailAltText}"
            height="600"
            width="1440"
        />
        <button class="cmp-video__play-btn" alt="Play video"></button>
        <div class="cmp-video__video">
            <!-- Brightcove Video -->
            <div data-sly-test="${video.isBrightcovePresent}" class="video-js-container">
                <video-js data-account="${video.brightcoveAccountId}"
                          data-player="${video.brightcovePlayerId}"
                          data-embed="default"
                          controls=""
                          class="vjs-fluid"
                          data-video-id="${video.brightcoveVideoId}"></video-js>
            </div>
            <script src="//players.brightcove.net/${video.brightcoveAccountId}/${video.brightcovePlayerId}_default/index.min.js"></script>
            <!-- Youtube Video -->
            <sly
                data-sly-test="${!video.isBrightcovePresent}"
                data-sly-resource="${ '.' @ resourceType='solidigm/components/embed', wcmmode='disabled'}"
            ></sly>
        </div>
    </div>
</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!hasContent}"></sly>
