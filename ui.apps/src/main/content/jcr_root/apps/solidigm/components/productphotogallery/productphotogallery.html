<sly  data-sly-use.productPhotoGallery="com.solidigm.core.models.ProductPhotoGallery"
      data-sly-use.template="core/wcm/components/commons/v1/templates.html"
      data-sly-test.hasContent="${productPhotoGallery.hasContent}">
    <div class="product-gallery">
        <h2 class="product-gallery__mobile-title">${currentPage.title}</h2>
        <div class="product-gallery__content">
            <div class="product-gallery__thumbnails"
                 data-sly-list.image="${productPhotoGallery.images}">
                <button class="product-gallery__thumbnails__image-wrapper" data-index="${imageList.count}" aria-label="Go to image 1">
                    <div class="product-gallery__thumbnails__show-more-tile" style="display: none;">
                        <span class="product-gallery__thumbnails__show-more-tile__text">+0</span>
                    </div>
                    <img class="product-gallery__thumbnails__image product-gallery__thumbnails__image--selected" src="${image.imageReference}" alt="${image.altText}">
                </button>
            </div>
            <img class="product-gallery__product-image" src="${productPhotoGallery.mainImage.imageReference}" alt="${productPhotoGallery.mainImage.altText}">
        </div>
    </div>
</sly>
<sly data-sly-call="${template.placeholder @ isEmpty=!hasContent, classAppend='cmp-title'}"></sly>
