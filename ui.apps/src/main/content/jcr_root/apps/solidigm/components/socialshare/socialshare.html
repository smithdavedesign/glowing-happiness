<div data-sly-use.socialShare="com.solidigm.core.models.SocialShare"
     class="cmp-social-share">
    <span>${'Share' @ i18n}</span>
    <div class="cmp-social-share__icons">
        <a aria-label="${'Share this article on Twitter' @ i18n}" href="${socialShare.twitterShare}" target="_blank" class="cmp-social-share__icon cmp-social-share__icon-twitter"></a>
        <a aria-label="${'Share this article on Linkedin' @ i18n}" href="${socialShare.linkedInShare}" target="_blank" class="cmp-social-share__icon cmp-social-share__icon-linkedin"></a>
    </div>
    <nav class="cmp-social-share__nav-links">
        <a href="${socialShare.previous @ extension = 'html'}" class="cmp-social-share__nav-link cmp-social-share__prev">${'Previous' @ i18n}</a>
        <a href="${socialShare.next @ extension = 'html'}" class="cmp-social-share__nav-link cmp-social-share__next">${'Next' @ i18n}</a>
    </nav>
</div>
