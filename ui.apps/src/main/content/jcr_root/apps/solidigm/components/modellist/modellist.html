<template data-sly-template.templateProduct="${@ product}">
    <div class="cmp-product-cards__item model-list__products__product">
        <div class="cmp-product-cards__img-container">
            <img src="${product.image}" alt="${product.altText}" />
        </div>
        <div class="cmp-product-cards__item-content">
            <h3 class="cmp-product-cards__item-title">${product.name}</h3>
            <p class="cmp-product-cards__item-description">${product.description}</p>
            <dl class="cmp-product-cards__item-specs">
                <dt>Interface:</dt>
                <dd>
                    <span class="cmp-product-cards__interface"> ${product.productInterface} </span>
                </dd>
                <dt>Form Factor:</dt>
                <dd>
                    <span class="cmp-product-cards__form-factor"> ${product.formFactor} </span>
                </dd>
                <dt>Capacity:</dt>
                <dd>
                    <span class="cmp-product-cards__capacity"> ${product.capacity} </span>
                </dd>
            </dl>
            <div class="cmp-product-cards__item-cta">
                <a
                    href="${product.productPagePath}"
                    class="solidigm-btn cmp-product-cards__details-btn"
                >
                    ${'View Details' @ i18n}
                </a>
                <a
                    href="${product.productPagePath}"
                    class="solidigm-btn solidigm-btn--outline solidigm-btn--outline-dark cmp-product-cards__configure-btn"
                >
                    ${'Configure' @ i18n}
                </a>
            </div>
        </div>
    </div>
</template>

<div
    class="model-list"
    data-sly-use.modelList="com.solidigm.core.models.ModelList"
    data-interface-any-label="${'Any Interface' @ i18n}"
    data-form-factor-any-label="${'Any Form Factor' @ i18n}"
    data-capacity-any-label="${'Any Capacity' @ i18n}"
>
    <h3 class="model-list__title">${modelList.title}!</h3>
    <div class="model-list__filters">
        <sly
            data-sly-use.component="solidigm/components/customselect/customselect.html"
            data-sly-call="${component.customSelect @ 
                                placeholder='Any Interface',
                                label='Interface',
                                id='interface',
                                name='interface',
                                srOnly=true}"
        />
        <div class="model-list__filters__bottom-row">
            <sly
                data-sly-use.component="solidigm/components/customselect/customselect.html"
                data-sly-call="${component.customSelect @ 
                                placeholder='Any Form Factor',
                                label='Form Factor',
                                id='form-factor',
                                name='form-factor',
                                srOnly=true}"
            />
            <sly
                data-sly-use.component="solidigm/components/customselect/customselect.html"
                data-sly-call="${component.customSelect @ 
                                placeholder='Any Capacity',
                                label='Capacity',
                                id='capacity',
                                name='capacity',
                                srOnly=true}"
            />
        </div>
    </div>
    <template class="model-list__template">
        <sly data-sly-call="${templateProduct @ product=null}" />
    </template>
    <div data-sly-list.featuredProduct="${modelList.featuredProducts}" class="model-list__products">
        <sly data-sly-call="${templateProduct @ product=featuredProduct}" />
    </div>
    <div class="model-list__cta">
        <a href="${modelList.link.link}" target="${modelList.link.target}">
            ${modelList.link.label}
            <span class="model-list__arrow-icon"></span>
        </a>
    </div>
</div>
