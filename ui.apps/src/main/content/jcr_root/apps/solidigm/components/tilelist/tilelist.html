<sly
    data-sly-use.tilelist="com.solidigm.core.models.TileList"
    data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
    data-sly-test.hasContent="${tilelist.hasContent}"
>
    <div class="cmp-tilelist">
        <ul class="cmp-tilelist__grid" data-sly-list.tileInfo="${tilelist.tileInfo}">
            <li class="cmp-tilelist__tile">
                <sly
                    data-sly-use.component="solidigm/components/icontile/icontile.html"
                    data-sly-call="${component.iconTile @ tileInfo=tileInfo}"
                />
            </li>
        </ul>
    </div>
</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!hasContent}"></sly>
