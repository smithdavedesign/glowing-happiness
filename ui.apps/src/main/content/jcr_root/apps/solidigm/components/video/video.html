<sly
    data-sly-use.video="com.solidigm.core.models.Video"
    data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
    data-sly-test.hasContent="${video.hasContent}"
>
    <div class="cmp-video">
        <img
            src="${video.thumbnailImageReference}"
            alt="${video.thumbnailAltText}"
            height="600"
            width="1440"
        />
        <button class="cmp-video__play-btn" alt="Play video"></button>
        <!-- @TODO conditionally show Brightcove or Youtube -->
        <div class="cmp-video__video">
            <!-- Brightcove Video -->
            <div class="video-js-container">
                <video-js
                    data-account="6272332767001"
                    data-player="5ukNGR047"
                    data-embed="default"
                    controls=""
                    class="vjs-fluid"
                    data-video-id="6273773612001"
                ></video-js>
            </div>
            <script src="//players.brightcove.net/6272332767001/5ukNGR047_default/index.min.js"></script>
            <!-- Youtube Video -->
            <sly
                data-sly-resource="${ '.' @ resourceType='solidigm/components/embed', wcmmode='disabled'}"
            ></sly>
        </div>
    </div>
</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!hasContent}"></sly>
