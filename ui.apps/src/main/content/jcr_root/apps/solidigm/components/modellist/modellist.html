<div class="model-list" data-sly-use.modelList="com.solidigm.core.models.ModelList">
    <h3 class="model-list__title">${modelList.title}</h3>
    <div class="model-list__filters">
        <label class="model-list__filters__label">${'Configure by' @ i18n} by</label>
        <select
            class="model-list__filters__filter"
            id="model-list__filters__interface-filter"
            name="interfaces"
        >
            <option value="" selected>${'Any Interface' @ i18n}</option>
        </select>
        <div class="model-list__filters__bottom-row">
            <select
                class="model-list__filters__filter"
                id="model-list__filters__form-factor-filter"
                name="formFactors"
            >
                <option value="" selected>${'Any Form Factor' @ i18n}</option>
            </select>
            <select
                class="model-list__filters__filter"
                id="model-list__filters__capacity-filter"
                name="capacities"
            >
                <option value="" selected>${'Any Capacity' @ i18n}</option>
            </select>
        </div>
    </div>
    <div data-sly-list.featuredProduct="${modelList.featuredProducts}" class="model-list__products">
        <div class="cmp-product-cards__item model-list__products__product">
            <div class="cmp-product-cards__img-container">
                <img src="${featuredProduct.image}" alt="${featuredProduct.altText}" />
            </div>
            <div class="cmp-product-cards__item-content">
                <h3 class="cmp-product-cards__item-title">${featuredProduct.name}</h3>
                <p class="cmp-product-cards__item-description">${featuredProduct.description}</p>
                <dl class="cmp-product-cards__item-specs">
                    <dt>Interface:</dt>
                    <dd>
                        <span>${featuredProduct.productInterface}</span>
                    </dd>
                    <dt>Form Factor:</dt>
                    <dd>
                        <span>${featuredProduct.formFactor}</span>
                    </dd>
                    <dt>Capacity:</dt>
                    <dd>
                        <span>${featuredProduct.capacity}</span>
                    </dd>
                </dl>
                <div class="cmp-product-cards__item-cta">
                    <a href="${featuredProduct.productPagePath}" class="solidigm-btn">
                        ${'View Details' @ i18n}
                    </a>
                    <a
                        href="${featuredProduct.productPagePath}"
                        class="solidigm-btn solidigm-btn--outline solidigm-btn--outline-dark"
                    >
                        ${'Configure' @ i18n}
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div class="model-list__cta">
        <a href="${modelList.link.link}" target="${modelList.link.target}">
            ${modelList.link.label}
            <span class="model-list__arrow-icon"></span>
        </a>
    </div>
</div>
