<div class="cmp-search-results"
     data-sly-use.searchResults="com.solidigm.core.models.SearchResults">
    <form id="search-form"
        data-results-per-page="10"
    >
        <label class="sr-only" for="search-bar">${'Search' @ i18n}</label>
        <input class="solidigm-input solidigm-input--underline" name="query" id="search-bar" />
        <span class="cmp-search-results__filter-label">${'Filter by Type' @ i18n}</span>
        <div class="cmp-search-results__filters">
            <input
                class="cmp-search-results__filter cmp-search-results__filter--selected"
                value="all"
                name="filter"
                type="checkbox"
                id="search-all"
            />
            <label for="search-all">
                <span>${'All ({0})' @ format=[searchResults.totalResults], i18n}</span>
            </label>

            <input
                class="cmp-search-results__filter"
                value="products"
                name="filter"
                type="checkbox"
                id="search-products"
            />
            <label for="search-products">
                <span>Products (27)</span>
            </label>

            <input
                class="cmp-search-results__filter"
                value="support"
                name="filter"
                type="checkbox"
                id="search-support"
            />
            <label for="search-support">
                <span>Support (10)</span>
            </label>

            <input
                class="cmp-search-results__filter"
                value="posts"
                name="filter"
                type="checkbox"
                id="search-posts"
            />
            <label for="search-posts">
                <span>Posts (6)</span>
            </label>
        </div>
    </form>
    <div class="cmp-search-results__total">
        <p data-results-template="${'Showing {0} of {1} results' @ format=[searchResults.resultsPerPage, searchResults.totalResults],i18n}"></p>
    </div>
    <ul class="cmp-search-results__results-container"
        data-sly-list.result="${searchResults.searchResults}">
        <li>
            <p>
                ${result.pagePath}
            </p>
            <p>
                ${result.title}
            </p>
            <p>
                ${result.description}
            </p>
            <p>
                ${result.url}
            </p>
            <p>
                ${result.image}
            </p>
            <p>
                ${result.altText}
            </p>
            <p>
                ------------------------------------------------
            </p>
        </li>
    </ul>
    <nav
        role="navigation"
        aria-label="Pagination Navigation"
        class="cmp-search-results__pagination"
    >
        <ul>
            <li>
                <button
                    class="cmp-search-results__double-arrow cmp-search-results__first-page"
                ></button>
            </li>
            <li>
                <button
                    class="cmp-search-results__arrow cmp-search-results__previous-page"
                ></button>
            </li>

            <li>
                <button class="cmp-search-results__arrow cmp-search-results__next-page"></button>
            </li>
            <li>
                <button
                    class="cmp-search-results__double-arrow cmp-search-results__last-page"
                ></button>
            </li>
        </ul>
    </nav>
</div>
