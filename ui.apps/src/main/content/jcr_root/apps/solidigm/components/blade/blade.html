<div class="cmp-blade"
     data-sly-use.blade="com.solidigm.core.models.Blade"
     data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
     data-sly-test.hasContent="${blade.hasContent}">


    <!--Video-->
    <div class="cmp-blade__media cmp-blade__media--video media-with-corner"
         data-sly-test.showVideo="${blade.showVideo}">
        <img src="${blade.imageReference}" alt="${blade.altText}" />
        <button data-modal-target="blade-modal-${blade.modalID}" aria-label="Play video"></button>
    </div>

    <!-- Image -->
    <div class="cmp-blade__media media-with-corner"
         data-sly-test="${!showVideo}">
        <img src="${blade.imageReference}" alt="${blade.altText}" />
    </div>

    

    <div class="cmp-blade__content">
        <h2 class="cmp-blade__title">${blade.title}</h2>
        <p ata-sly-test.description="${blade.description}" class="cmp-blade__description" style="white-space: pre-line;">
            ${blade.description}
        </p>
        <ul class="cmp-blade__list"
            data-sly-list.bullet="${blade.bullets}">
            <li>
                <a data-sly-test.link="${bullet.link}" href="${bullet.link}" target="${bullet.target}">
                    ${bullet.label}
                </a>
                <span data-sly-test.link="${!bullet.link}">${bullet.label}</span>
            </li>
        </ul>
        <div class="cmp-blade__cta-container"
             data-sly-list.callToAction="${blade.callToActions}">
            <a href="${callToAction.link}" target="${callToAction.target}" class="solidigm-btn ${callToAction.buttonStyle == 'opaque' ? '' : 'solidigm-btn--outline solidigm-btn--outline-dark'}">
                ${callToAction.label}
            </a>
        </div>
    </div>
</div>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!hasContent}"></sly>


<dialog id="blade-modal-${blade.modalID}" class="cmp-modal cmp-modal__video">
    <button
        class="cmp-modal__close-btn"
        aria-label="Close video modal"
        onclick="this.closest('dialog').close('close')"
    ></button>
    <div class="cmp-modal__iframe-container"
    data-sly-resource="${ '.' @ resourceType='solidigm/components/embed', wcmmode='disabled'}">
        
    </div>
    <div class="cmp-modal__iframe-container">
        <div class="video-js-container">
            <video-js
                data-account="6272332767001"
                data-player="5ukNGR047"
                data-embed="default"
                controls=""
                class="vjs-fluid"
                data-video-id="6273773612001"
            ></video-js>
        </div>
        <script src="//players.brightcove.net/6272332767001/5ukNGR047_default/index.min.js"></script>
    </div>
</dialog>
