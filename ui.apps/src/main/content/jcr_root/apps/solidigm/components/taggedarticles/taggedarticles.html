<div data-sly-use.taggedArticles="com.solidigm.core.models.TaggedArticles"
     class="cmp-tagged-articles">
    <div class="cmp-tagged-articles__filter" data-sly-test="${!taggedArticles.selectorTag}">
        <span>Filter by</span>
        <label for="tagged-articles-filter" class="sr-only">Filter</label>
        <select
            id="tagged-articles-filter"
            class="solidigm-select"
            data-servlet-path="${taggedArticles.rootPath}"
        >
            <option selected disabled>Chose a category...</option>
            <sly data-sly-list.tag="${taggedArticles.dropdownTags}">
                <option value="${tag.id}">${tag.title}</option>
            </sly>
        </select>
    </div>
    <div class="cmp-tagged-articles__title" data-sly-test="${taggedArticles.selectorTag}">
        <h2>Posts Tagged “${taggedArticles.selectorTag}”</h2>
    </div>
    <div class="cmp-tagged-articles__articles-container"></div>
    <button class="solidigm-btn cmp-tagged-articles__load-more-btn">Load More</button>
</div>
