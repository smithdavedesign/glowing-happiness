# Use a skeleton to build, test and deploy using manual and parallel steps
image: atlassian/default-image:3

pipelines:
  branches:
      develop:
        - step:
           name: Sync develop with adobe branches
           script:
             - echo "Update adobe-develop branch with develop"
             - git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
             - git remote update
             - git fetch
             - git checkout adobe-develop
             - git merge develop --log=9999
             - echo "Push changes to adobe-develop"
             - git push origin adobe-develop
             - echo "Update adobe-stage branch with adobe-develop"
             - git checkout adobe-stage
             - git merge adobe-develop
             - git push origin adobe-stage
      adobe-develop:
        - step:
           name: Sync Bitbucket repo with AEM repo
           script:
             - echo "Add remote sync git URL"
             - git remote add sync https://$CM_SYNC_USER_NAME:$CM_SYNC_USER_ACCESS_TOKEN@git.cloudmanager.adobe.com/newco/solidigm/
             - git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
             - git remote update
             - git checkout adobe-develop
             - echo "Push changes to Adobe Cloud Manager"
             - git push -f -v sync adobe-develop
      adobe-stage:
        - step:
           name: Sync Bitbucket repo with AEM repo
           script:
             - echo "Add remote sync git URL"
             - git remote add sync https://$CM_SYNC_USER_NAME:$CM_SYNC_USER_ACCESS_TOKEN@git.cloudmanager.adobe.com/newco/solidigm/
             - echo "Update aem adobe-stage branch with bitbucket adobe-develop"
             - git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
             - git remote update
             - git checkout origin/adobe-stage
             - echo "Push changes to Adobe Cloud Manager"
             - git push -f -v sync adobe-stage