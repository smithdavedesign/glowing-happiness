<div
    class="cmp-product-comparison-overlay"
    data-interface-label="${'Interface' @ i18n}"
    data-form-factor-label="${'Form Factor' @ i18n}"
    data-capacity-label="${'Capacity' @ i18n}"
    data-remove-label="${'Remove' @ i18n}"
    data-selected-products-label="${'{0} Products Selected' @ i18n}"
>
    <div class="cmp-product-comparison-overlay__content">
        <div class="cmp-product-comparison-overlay__data--compact">
            <img src="" alt="" />
            <div>
                <h2 class="cmp-product-comparison-overlay__compact-title"></h2>
                <p class="cmp-product-comparison-overlay__compact-subtitle">
                    ${'Maximum of 3 Products' @ i18n}
                </p>
                <button data-details-btn="" class="cmp-product-comparison-overlay__compact-cta">
                    ${'View Details' @ i18n}
                </button>
            </div>
            <button class="solidigm-btn cmp-product-comparison-overlay__compare-btn">
                ${'Compare' @ i18n}
            </button>
            <button
                data-details-btn=""
                class="solidigm-btn cmp-product-comparison-overlay__view-details-btn"
            >
                ${'View Details' @ i18n}
            </button>
        </div>
        <div class="cmp-product-comparison-overlay__data--expanded">
            <div class="cmp-product-comparison-overlay__expanded-title-container">
                <button
                    class="cmp-product-comparison-overlay__btn-close"
                    aria-label="close expanded details"
                ></button>
                <h2 class="cmp-product-comparison-overlay__expanded-title">
                    3 ${'Products Selected' @ i18n}
                </h2>
            </div>
            <div class="cmp-product-comparison-overlay__expanded-grid">
                <div
                    class="cmp-product-comparison-overlay__expanded-controls cmp-product-comparison-overlay__expanded-controls--desktop"
                >
                    <p class="cmp-product-comparison-overlay__controls-title">
                        ${'Ready to compare these products?' @ i18n}
                    </p>
                    <a href="#" class="solidigm-btn solidigm-btn--lg-padding">
                        ${'Compare' @ i18n}
                    </a>
                    <button class="cmp-product-comparison-overlay__controls-remove-all">
                        ${'Remove all' @ i18n}
                    </button>
                </div>
            </div>
            <div
                class="cmp-product-comparison-overlay__expanded-controls cmp-product-comparison-overlay__expanded-controls--mobile"
            >
                <p class="cmp-product-comparison-overlay__controls-title">
                    ${'Ready to compare these products?' @ i18n}
                </p>
                <a href="#" class="solidigm-btn solidigm-btn--lg-padding"> ${'Compare' @ i18n} </a>
                <button class="cmp-product-comparison-overlay__controls-remove-all">
                    ${'Remove all' @ i18n}
                </button>
            </div>
        </div>
    </div>
</div>
