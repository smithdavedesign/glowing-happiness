<sly
    data-sly-use.partnerList="com.solidigm.core.models.PartnerList"
    data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
    data-sly-test.hasContent="${partnerList.hasContent}"
>
    <div class="partners-list">
        <div class="partners-list__filters">
            <span class="partners-list__filters__label">Filter by</span>
            <label class="sr-only" for="partners-list__filters__country-filter">Country</label>
            <select
                class="solidigm-select"
                id="partners-list__filters__country-filter"
                name="countries"
            >
                <option value="" selected="">Country</option>
                <sly data-sly-list.country="${partnerList.countries}">
                    <option value="${country.tagID}">${country.title}</option>
                </sly>
            </select>
            <label for="partners-list__filters__product-filter">Product</label>
            <select
                class="solidigm-select"
                id="partners-list__filters__product-filter"
                name="products"
            >
                <option value="" selected="">Product</option>
                <sly data-sly-list.product="${partnerList.products}">
                    <option value="${product.tagID}">${product.title}</option>
                </sly>
            </select>
        </div>
        <table class="partners-list__partners">
            <tbody>
                <tr class="partners-list__partners__table-head">
                    <th>${partnerList.partnerType}</th>
                    <th>Country</th>
                    <th class="partners-list__partners__website-column">Website</th>
                </tr>
                <sly data-sly-list.partner="${partnerList.partners}">
                    <tr
                        class="partners-list__partners__table-row"
                        data-partner-country="${partner.countryID}"
                        data-partner-product="${partner.products}"
                    >
                        <td>
                            ${partner.companyName} ${partner.additionalInfo}
                        </td>
                        <td>${partner.countryName}</td>
                        <td class="partners-list__partners__website-column">
                            <a
                                class="partners-list__partners__website-column__link"
                                href="${partner.link}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                            </a>
                        </td>
                    </tr>
                </sly>
            </tbody>
        </table>
        <p class="partners-list__no-results">No Results</p>
    </div>
</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!hasContent}"></sly>
