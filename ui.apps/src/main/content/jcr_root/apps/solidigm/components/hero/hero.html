<sly data-sly-use.hero="com.solidigm.core.models.Hero"
     data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
     data-sly-test.hasContent="${hero.hasContent}" >
     <div 
        class="cmp-hero ${hero.filter == 'darken' ? 'cmp-hero--with-overlay' : ''}"
     >
        <div class="cmp-hero__background-image cmp-hero__background-image--desktop">
            <img src="${hero.desktopImageReference}" alt="${hero.desktopAltText}"/>
        </div>
        <div class="cmp-hero__background-image cmp-hero__background-image--mobile">
            <img src="${hero.mobileImageReference}" alt="${hero.mobileAltText}"/>
        </div>

        <div class="cmp-hero__content">
            <div id="heroGreetingTarget"></div>
            <div data-sly-test="${hero.showBreadcrumb}">
                <nav class="cmp-breadcrumb"
                    aria-label="${'Breadcrumb' @ i18n}"
                    data-sly-test="${hero.breadcrumbItems}">
                    <ol class="cmp-breadcrumb__list"
                        itemscope itemtype="http://schema.org/BreadcrumbList"
                        data-sly-list.navItem="${hero.breadcrumbItems}">
                        <li class="cmp-breadcrumb__item${navItem.active ? ' cmp-breadcrumb__item--active' : ''}"
                            aria-current="${navItem.active ? 'page' : false}"
                            data-cmp-data-layer="${navItem.data.json}"
                            itemprop="itemListElement" itemscope itemtype="http://schema.org/ListItem">
                            <a data-sly-attribute="${navItem.link.htmlAttributes}"
                                class="cmp-breadcrumb__item-link"
                                itemprop="item"
                                data-cmp-clickable="${breadcrumb.data ? true : false}"
                                data-sly-unwrap="${navItem.active || !navItem.link.valid}">
                                <span itemprop="name">${navItem.title}</span>
                            </a>
                            <meta itemprop="position" content="${navItemList.count}" />
                        </li>
                    </ol>
                </nav>
            </div>
            <h2 class="cmp-hero__title" data-sly-test="${hero.title}">${hero.title}</h2>
            <h3 class="cmp-hero__subtitle" data-sly-test="${hero.subtitle}">${hero.subtitle}</h3>
            <div class="cmp-hero__description" data-sly-test="${hero.description}">
                ${hero.description @ context='html'}
            </div>
            <div data-sly-test="${hero.anchors}" class="cmp-hero__internal-links-list">
                <ul data-sly-list.anchor="${hero.anchors}">
                    <li>
                        <a href="#${anchor.anchorID}">${anchor.anchorLabel}</a>
                    </li>
                </ul>
            </div>
            <div class="cmp-hero__cta-container">
                <sly data-sly-list.callToAction="${hero.callToActions}">
                    <a href="${callToAction.link}" class="solidigm-btn ${callToAction.buttonStyle == 'opaque' ? '' : 'solidigm-btn--outline'}">
                        ${callToAction.label}
                    </a>
                </sly>
            </div>
        </div>
     </div>
</sly>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!hasContent}"></sly>
