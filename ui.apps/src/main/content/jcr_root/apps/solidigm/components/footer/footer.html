<div data-sly-use.footer="com.solidigm.core.models.Footer">
    <h1>${footer.searchTitle}</h1>
    <section class="cmp-search">
        <form class="cmp-search__form"
            method="get"
            action="${footer.searchResultsPage}.html">
            <div class="cmp-search__field">
                <i class="cmp-search__icon"
                data-cmp-hook-search="icon"></i>
                <input class="cmp-search__input"
                    type="text"
                    name="q" placeholder="${footer.placeholderText}"
                    required="required"/>
            </div>
        </form>
    </section>
    <sly data-sly-list.searchTagLink="${footer.searchTagsLinks}">
        <a href="${searchTagLink.link}" role="button">${searchTagLink.label}</a>
    </sly>
    ${footer.disclaimer @ context='html'}
    ${footer.trademark @ context='html'}
    ${footer.copyright @ context='html'}
    <a href="${footer.facebook}" role="button">Facebook</a>
    <a href="${footer.linkedIn}" role="button">LinkedIn</a>
    <sly data-sly-list.link="${footer.links}">
        <a href="${link.link}" role="button">${link.label}</a>
    </sly>
</div>
