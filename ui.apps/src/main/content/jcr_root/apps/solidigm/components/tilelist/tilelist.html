<sly data-sly-use.tilelist="com.solidigm.core.models.TileList"
data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html">
    <div class="cmp-tilelist">
        <ul class="cmp-tilelist__grid" data-sly-list.tileInfo="${tilelist.tileInfo}">
            <li class="cmp-tilelist__tile">
                <div class="cmp-tilelist__icon icon--${tileInfo.icon}"></div>
                <h2 class="cmp-tilelist__title">${tileInfo.title}</h2>
                <p class="cmp-tilelist__description">
                    ${tileInfo.description}
                </p>
                <sly data-sly-test.hasLink="${tileInfo.link}">
                <a href="${tileInfo.link}" target="${tileInfo.target}" class="solidigm-btn solidigm-btn--external">
                    <span> ${tileInfo.label} ${tileInfo.title}</span>
                </a>
                </sly>
            </li>
        </ul>
    </div>
</sly>
